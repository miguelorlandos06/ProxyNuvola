name: Build ProxyNuvola APK
on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          cmdline-tools-version: 'latest'
      - uses: gradle/actions/setup-gradle@v3
      - run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleRelease --no-daemon

      # Copia de seguridad: subir al bucket toDus (puede fallar por la comilla, no bloquea)
      - name: Upload APK to toDus bucket (best effort)
        if: success()
        continue-on-error: true
        run: |
          APK=app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "dev")
          BASE="https://s3.todus.cu"
          BUCKET="stream"
          NAME=ProxyNuvola/ProxyNuvola-${VERSION}.apk
          NAME_LATEST=ProxyNuvola/ProxyNuvola-latest.apk
          echo "APK size: $(ls -lh "$APK" | awk '{print $5}')"
          curl -fsSL -X PUT --data-binary "@$APK" -H "Content-Type: application/vnd.android.package-archive" "$BASE/$BUCKET/$NAME" -o /dev/null -w "HTTP %{http_code}\n" || true
          curl -fsSL -X PUT --data-binary "@$APK" -H "Content-Type: application/vnd.android.package-archive" "$BASE/$BUCKET/$NAME_LATEST" -o /dev/null -w "HTTP %{http_code}\n" || true

      # Artifact de GitHub (siempre disponible, 90 días)
      - uses: actions/upload-artifact@v4
        with:
          name: ProxyNuvola-apk
          path: app/build/outputs/apk/release/app-armeabi-v7a-release.apk

      # Release automático solo cuando se empuja un tag v*
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
